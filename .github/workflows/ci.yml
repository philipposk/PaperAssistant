name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm install
      - run: cd vendor/page-assistant && npm install && npm run build
      - run: cd app && npm ci
      - run: cd app && npm test
      - run: cd app && npm run build
